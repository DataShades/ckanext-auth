<div id="mfa-form" style="display: none;">
    {% block totp_2fa_provisioning %}
        {% snippet "auth/snippets/2fa_qr_code.html" %}
    {% endblock %}

    {% block totp_2fa_verification %}
    <p class="my-3">{{_('Please enter your authenticator app generated 6-digit verification code.')}}</p>

    <div class="form-group control-medium">
        <label class="form-label" for="field-code">{{ _("Verification code") }}</label>
        <div class="controls ">
            <input id="code" type="text" name="code" autocomplete="off" class="form-control">
        </div>
    </div>

    <div class="form-actions">
        {% block totp_2fa_provisioning_help %}{% endblock %}
        <button class="btn btn-primary" id="mfa-submit">{{ _('Submit') }}</button>
    </div>
    {% endblock %}
</div>
