name: Tests
on:
    push:
    pull_request:
    workflow_dispatch:
    workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7
          with:
            python-version: '3.14'
        - name: Install requirements
          run: pip install flake8 pycodestyle
        - name: Check syntax
          run: flake8 . --count --select=E901,E999,F821,F822,F823 --show-source --statistics --extend-exclude ckan
#        - name: Ruff Check
#          run:  pip intall ruff && ruff --config pyproject.toml check ##We use an action hook but locally should be this command
        - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 #v4.1.0

  test:
    strategy:
      fail-fast: false
      matrix:
        ckan-version: [ '2.12', '2.11', '2.10' ]
        experimental: [ false ]
        include:
          - ckan-version: 'master'
            experimental: true  # master is unstable, good to know if we are compatible or not

    name: ${{ matrix.experimental && '**Fail_Ignored** ' || '' }} CKAN ${{ matrix.ckan-version }}
    runs-on: ubuntu-latest
    container:
      # The CKAN version tag of the Solr and Postgres containers should match
      # the one of the container the tests run on.
      # You can switch this base image with a custom image tailored to your project
      image: ckan/ckan-dev:${{ matrix.ckan-version }}
      options: --user 0
    services:
      solr:
        image: ckan/ckan-solr:${{ matrix.ckan-version }}-solr9
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
          image: redis:8

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        timeout-minutes: 1
        continue-on-error: ${{ matrix.experimental }}

      - name: Install requirements
        # Install any extra requirements your extension has here (dev requirements, other extensions etc)
        run: |
          pip install "setuptools>=44.1.0,<71"
          pip install -r dev-requirements.txt
          pip install -r test-requirements.txt
          pip install -e .
          # Replace default path to CKAN core config file with the one on the container
          sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test.ini
        timeout-minutes: 10
        continue-on-error: ${{ matrix.experimental }}

      - name: Setup extension
        # Extra initialization steps
        run: |
          ckan -c test.ini db init
        continue-on-error: ${{ matrix.experimental }}

      - name: Run tests
        run: |
          pytest --ckan-ini=test.ini --cov=ckanext.auth --disable-warnings ckanext/auth/tests --junit-xml=/tmp/artifacts/junit/results.xml
        continue-on-error: ${{ matrix.experimental }}

      - name: ${{ matrix.experimental && '**Fail_Ignored** ' || '' }} Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 #v2
        continue-on-error: ${{ matrix.experimental }}
        with:
          paths: "/tmp/artifacts/junit/*.xml"
        if: always()